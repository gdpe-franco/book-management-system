openapi: 3.1.0
info:
  title: Book Management System API
  version: 1.0.0
  description: Versioned HTTP contract for implemented API endpoints.
servers:
  - url: http://localhost:8000
x-socketio:
  url: http://localhost:3000/socket.io/
  authentication: Send the complete bearer value in handshake.auth.authorization; it is validated by Laravel.
  event:
    name: audit.log.created
    description: Broadcast after a new Audit log is persisted. Delivery is transient; use GET /api/v1/audit-logs to recover missed events.
    payload:
      $ref: '#/components/schemas/AuditLog'
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an admin and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Admin registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate an existing user and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/audit-logs:
    get:
      tags: [Audit logs]
      summary: List persisted Audit logs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AuditSearch'
        - $ref: '#/components/parameters/AuditSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Paginated Audit history ordered by occurrence time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogs'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the bearer token used by this request
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/books:
    get:
      tags: [Books]
      summary: List active books
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/BookSearch'
        - $ref: '#/components/parameters/BookSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Paginated active books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Books]
      summary: Create a book
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/books/{id}:
    get:
      tags: [Books]
      summary: Return an active book
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Active book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      summary: Update a book
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdateRequest'
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Books]
      summary: Soft-delete a book
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Book soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, superadmin]
    Book:
      type: object
      required: [id, title, author, isbn, published_year]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        published_year:
          type: integer
    BookResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Book'
    BookCreateRequest:
      type: object
      required: [title, author, isbn, published_year]
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        isbn:
          type: string
          pattern: '^(?:[0-9]{9}[0-9Xx]|[0-9]{13})$'
        published_year:
          type: integer
          minimum: 1450
          description: Must not exceed the server's current calendar year.
    BookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        isbn:
          type: string
          pattern: '^(?:[0-9]{9}[0-9Xx]|[0-9]{13})$'
        published_year:
          type: integer
          minimum: 1450
          description: Must not exceed the server's current calendar year.
    PaginatedBooks:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    AuditLog:
      type: object
      required: [event_id, event_type, event_version, occurred_at, actor_id, book_snapshot, changes, persisted_at]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [book.created, book.updated, book.deleted]
        event_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp with second precision.
        actor_id:
          type: integer
          minimum: 1
        book_snapshot:
          type: object
          additionalProperties: true
        changes:
          type: object
          additionalProperties: true
        persisted_at:
          type: string
          format: date-time
          description: UTC timestamp with second precision.
    PaginatedAuditLogs:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    TokenResponse:
      type: object
      required: [data, token, token_type]
      properties:
        data:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Plaintext bearer token, returned only when issued.
        token_type:
          type: string
          const: Bearer
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Unauthenticated:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    InvalidCredentials:
      description: Invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    BookSearch:
      name: search
      in: query
      description: Trimmed, case-insensitive contains search across title, author, and ISBN.
      schema:
        type: string
        maxLength: 255
    BookSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [title, author, isbn, published_year]
    SortDirection:
      name: sort_direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
    AuditSearch:
      name: search
      in: query
      description: Trimmed, case-insensitive contains search across event type and event ID.
      schema:
        type: string
        maxLength: 255
    AuditSortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [event_type, event_id, actor_id, occurred_at]
