openapi: 3.1.0
info:
  title: Book Management System API
  version: 1.0.0
  description: Versioned HTTP contract for implemented API endpoints.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an admin and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Admin registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate an existing user and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the bearer token used by this request
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, superadmin]
    TokenResponse:
      type: object
      required: [data, token, token_type]
      properties:
        data:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Plaintext bearer token, returned only when issued.
        token_type:
          type: string
          const: Bearer
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Unauthenticated:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    InvalidCredentials:
      description: Invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
