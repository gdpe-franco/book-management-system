openapi: 3.1.0
info:
  title: Book Management System API
  version: 1.0.0
  description: Versioned HTTP contract for implemented API endpoints.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an admin and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Admin registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate an existing user and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the bearer token used by this request
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/books:
    get:
      tags: [Books]
      summary: List active books
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/BookTitleFilter'
        - $ref: '#/components/parameters/BookAuthorFilter'
        - $ref: '#/components/parameters/BookIsbnFilter'
      responses:
        '200':
          description: Paginated active books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Books]
      summary: Create a book
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/books/{id}:
    get:
      tags: [Books]
      summary: Return an active book
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Active book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      summary: Update a book
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdateRequest'
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, superadmin]
    Book:
      type: object
      required: [id, title, author, isbn, published_year]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        published_year:
          type: integer
    BookResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Book'
    BookCreateRequest:
      type: object
      required: [title, author, isbn, published_year]
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        isbn:
          type: string
          pattern: '^(?:[0-9]{9}[0-9Xx]|[0-9]{13})$'
        published_year:
          type: integer
          minimum: 1450
          description: Must not exceed the server's current calendar year.
    BookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        isbn:
          type: string
          pattern: '^(?:[0-9]{9}[0-9Xx]|[0-9]{13})$'
        published_year:
          type: integer
          minimum: 1450
          description: Must not exceed the server's current calendar year.
    PaginatedBooks:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    TokenResponse:
      type: object
      required: [data, token, token_type]
      properties:
        data:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Plaintext bearer token, returned only when issued.
        token_type:
          type: string
          const: Bearer
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Unauthenticated:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    InvalidCredentials:
      description: Invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    BookTitleFilter:
      name: title
      in: query
      description: Trimmed, case-insensitive contains filter.
      schema:
        type: string
    BookAuthorFilter:
      name: author
      in: query
      description: Trimmed, case-insensitive contains filter.
      schema:
        type: string
    BookIsbnFilter:
      name: isbn
      in: query
      description: Trimmed, case-insensitive contains filter.
      schema:
        type: string
        maxLength: 13
